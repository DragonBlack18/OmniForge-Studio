name: Apply reviewed integration sources
on:
  push:
    branches: [feature/v0.7.9-integrated-workbench]
    paths: [.github/workflows/apply-readable-integration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply readable source edits with before and after integrity checks
        run: |
          node .github/apply-integration-review.mjs
          git diff --exit-code -- .github
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'feat(v0.7.9): reconcile authoring and protected recovery in one reversible store'
          git push origin HEAD:feature/v0.7.9-integrated-workbench
