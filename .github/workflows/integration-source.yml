name: Pinned integration source review
on:
  push:
    branches: [feature/v0.7.9-unified-flows]
    paths: [.github/workflows/integration-source.yml]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive source only without executing branch code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          git archive --format=zip 3ab8f1513523817c69b8488e39973c00d5a9debd -o "$RUNNER_TEMP/sources/base.zip"
          git archive --format=zip dfe3d4c4c93d61d155679f45d2bd4d319ba6a16d -o "$RUNNER_TEMP/sources/authoring.zip"
          git archive --format=zip c82e117a315dd55eaacea0ebb1f52603c37462a7 -o "$RUNNER_TEMP/sources/recovery.zip"
          cd "$RUNNER_TEMP/sources"
          sha256sum *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OmniForge-pinned-integration-sources
          path: ${{ runner.temp }}/sources/*
          retention-days: 2
          if-no-files-found: error
