name: OmniForge Extension Hub v0.3.0 gates
on:
  push:
    branches: [feature/v0.3.0-extension-hub]
permissions:
  contents: read
concurrency:
  group: extension-hub-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-core:
    name: Extension SDK + storage on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node --check core/extension-contract.mjs
      - run: node --check core/extension-registry.mjs
      - run: node --check core/extension-runtime.mjs
      - run: node --check electron/main.cjs
      - run: npm test
  renderer:
    name: Production renderer build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
  desktop-e2e:
    name: Real Electron extension install + full regression
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Extension Hub E2E
        run: npm run smoke:extensions
        timeout-minutes: 5
      - name: Existing workflow E2E
        run: npm run smoke:electron
        timeout-minutes: 5
      - name: DXF import E2E
        run: npm run smoke:cad-import
        timeout-minutes: 5
      - name: Build real Windows Portable and NSIS packages
        run: npm run dist:win
        timeout-minutes: 15
      - name: Installed app smoke including Extension Hub ASAR runtime
        shell: pwsh
        run: ./scripts/windows-distribution-smoke.ps1
        timeout-minutes: 10
      - name: Hash generated unsigned binaries
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash, $_.Name
          } | Out-File release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OmniForge-ExtensionHub-v0.3.0-Windows-unsigned
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
