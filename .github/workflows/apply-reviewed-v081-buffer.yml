name: Apply reviewed v081 buffer correction
on:
  push:
    branches: [feature/v0.8.1-workspace-layout]
    paths: [.github/workflows/apply-reviewed-v081-buffer.yml]
permissions:
  contents: write
jobs:
  reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed patch and remove transport
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = daba0dfba87ebee3d380233444d8f4f929eb11fb
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='39ffb3ffc527f2029dcc2e5ecca6e97bf5bc72e15fa9b222315f35f1c726282f'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm .github/workflows/apply-reviewed-v081-buffer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ide): preserve live Monaco buffer across delayed React renders'
          git push origin HEAD:refs/heads/feature/v0.8.1-workspace-layout
