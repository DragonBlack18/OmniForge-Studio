name: Apply reviewed IDE workspace source
on:
  push:
    branches: [feature/v0.8.2-ide-workspace]
    paths: [.github/workflows/apply-reviewed-v082.yml]
permissions:
  contents: write
jobs:
  reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply exact reviewed source patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = e282b0f061eb49cd0d940e1b1e72a24d5df27c60
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          # Temporary feature-branch transport only: exact local source patch,
          # not downloaded executable code. The final tree contains no helpers.
          encoded=''.join(pathlib.Path(f'.review-v082/part-{i}.b64').read_text().strip() for i in range(1,5))
          assert len(encoded)==37340
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==106833
          assert hashlib.sha256(patch).hexdigest()=='4cf5ba0b509bfcd416b6998a93ed44b71430d18d1ae3f27538faf9576660c302'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm -r .review-v082 .github/workflows/apply-reviewed-v082.yml
          test "$(git write-tree)" = a1153fc3e50432e84a8adca999dea56c9ab1dbf8
          node --test tests/document-session.test.mjs tests/language-tools.test.mjs tests/editor-buffer.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ide): isolated documents, live diagnostics, symbols and revision review'
          git push origin HEAD:refs/heads/feature/v0.8.2-ide-workspace
