name: Temporary source snapshot v078
on:
  push:
    branches: [feature/v0.7.8-cad-toolkit]
permissions:
  contents: read
jobs:
  snapshot:
    if: ${{ github.event.head_commit.message == 'ci: export v078 editable source snapshot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked files
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OmniForge-v078-source
          path: source.zip
          retention-days: 2
          if-no-files-found: error
