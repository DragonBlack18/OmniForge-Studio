name: Export pinned integration sources
on:
  push:
    branches: [feature/v0.7.9-integrated-workbench]
    paths: [.github/workflows/export-integration-inputs.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare unchanged baseline dependencies; never execute PR source
        run: |
          mkdir -p snapshots offline
          git show 3ab8f1513523817c69b8488e39973c00d5a9debd:package.json > offline/package.json
          cd offline
          npm install --ignore-scripts --no-audit --no-fund
          tar -czf ../snapshots/baseline-dependencies.tar.gz node_modules package-lock.json
      - name: Archive sources only
        run: |
          git archive --format=zip 3ab8f1513523817c69b8488e39973c00d5a9debd -o snapshots/base.zip
          git archive --format=zip dfe3d4c4c93d61d155679f45d2bd4d319ba6a16d -o snapshots/authoring.zip
          git archive --format=zip c82e117a315dd55eaacea0ebb1f52603c37462a7 -o snapshots/recovery.zip
          sha256sum snapshots/*.zip snapshots/*.gz > snapshots/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integration-source-inputs
          path: snapshots/*
          retention-days: 2
