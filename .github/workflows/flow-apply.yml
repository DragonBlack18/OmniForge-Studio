name: Apply reviewed flow authoring patch
on:
  push:
    branches: [feature/v0.7.9-flow-authoring]
    paths: [.github/workflows/flow-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, lzma, hashlib, urllib.request, subprocess
          from pathlib import Path
          expected_parent='95ff8052191ad591dbfeabccde61f69874ded892'
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if parent != expected_parent: raise SystemExit('Unexpected branch parent; no changes applied')
          chunks=[]
          for sha in ['8de9dbbb32925bd08678045a7e5c1ad23452b593','7090b2a4b5025975bad835784758d79e0f5d9c4c']:
              request=urllib.request.Request('https://api.github.com/repos/DragonBlack18/OmniForge-Studio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response: blob=json.load(response)
              chunks.append(base64.b64decode(blob['content']))
          raw=b''.join(chunks)
          if hashlib.sha256(raw).hexdigest() != 'dd9d1d9289632ac8e1ef6b592d44d87dc372db96d2daed1856d9591b1ee640ec': raise SystemExit('Patch integrity failure')
          patch=Path('/tmp/flow-authoring.patch'); patch.write_bytes(lzma.decompress(raw))
          subprocess.run(['git','apply','--check','--unidiff-zero','--exclude=.github/workflows/*',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--exclude=.github/workflows/*',str(patch)],check=True)
          if json.loads(Path('package.json').read_text())['version']!='0.7.9': raise SystemExit('Unexpected target version')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(v0.7.9): reversible flow authoring, contextual diagnostics and eight data tools'
          git push origin HEAD:feature/v0.7.9-flow-authoring
