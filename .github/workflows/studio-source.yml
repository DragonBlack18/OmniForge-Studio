name: Studio UX source snapshot
on:
  push:
    branches: [feature/v0.7.7-studio-ux]
    paths: [.github/workflows/studio-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked sources only
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OmniForge-source-v077-baseline
          path: source.zip
          retention-days: 3
          if-no-files-found: error
