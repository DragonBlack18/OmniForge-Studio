name: v090 bounded Windows diagnostics
on:
  push:
    branches: [diagnostics/v090-windows-test-logs]
    paths: [.github/workflows/v090-log-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing failed jobs without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          for job in 129076565664 129076504587; do
            gh api --allow-escape-sequences repos/DragonBlack18/OmniForge-Studio/actions/jobs/$job/logs > diagnostics/$job.log
          done
          python3 - <<'PY'
          import pathlib,re
          for source in pathlib.Path('diagnostics').glob('*.log'):
              lines=source.read_text(encoding='utf-8-sig').splitlines()
              indexes=set()
              for n,line in enumerate(lines):
                  if re.search(r'not ok|ERR_TEST|testTimeoutFailure|failureType:|error:|cancelledByParent|##\[error\]|phase=',line):
                      indexes.update(range(max(0,n-5),min(len(lines),n+22)))
              selected=[f'{n+1}: {lines[n]}' for n in sorted(indexes)]
              text='\n'.join(selected[-180:]) or '\n'.join(lines[-50:])
              source.with_suffix('.txt').write_text(text,encoding='utf-8')
              print(source.name+'\n'+text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OmniForge-v090-Windows-Failure-Logs
          path: diagnostics/
          retention-days: 3
          if-no-files-found: error
