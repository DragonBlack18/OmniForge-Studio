name: Apply reviewed Studio interaction fixes
on:
  push:
    branches: [feature/v0.7.7-studio-ux]
    paths: [.github/workflows/studio-refine.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.7-studio-ux
      - name: Verify and apply reviewed source delta
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/feature/v0.7.7-studio-ux'
          entries=json.loads(r'''[{"path":"src/modules/cad/CadWorkbench.jsx","before":"d9278dddda21763ce48dfe67a85633cb5264d4face2ac0226eb911cee8860959","after":"88a0375570b39af22da719588dd262ebf29c09ae2203c28747548ffdc0f55ad0","edits":[[4505,4505,"  // Undo may remove the active layer. Keep selection references in the restored document.\n  useEffect(()=>{\n    if(!sketch.layers.some(layer=>layer.id===layerId))setLayerId(sketch.layers[0].id);\n    if(selected&&!sketch.entities.some(entity=>entity.id===selected))setSelected(null);\n  },[sketch.layers,sketch.entities,layerId,selected]);\n"]]},{"path":"src/workbench/AppShell.jsx","before":"8e98f9879e2585ee83d3636b1a315c91538c59a953a23bb0ac1b157b304b0dc4","after":"a8811c427df2fb5eef5722c40d80d330105efeddccbca8aa4ec6a7a4e5d4ec98","edits":[[29020,29241,"        {mode==='canvas' && <button disabled={busy||!workspace||!flowDirty} type=\"button\" onClick={save} className=\"button button--solid topbar-save\"><NavGlyph name=\"check\" size={15}/> Salvar fluxo</button>}\n"]]},{"path":"src/modules/cad/CadInspector.jsx","before":"9814d22a8b53931f1b1c19e8ee7c3588968511cd9e3ef8f575e48da1827c3a9f","after":"20f7c41464e289e31f5d6ed03ed0268bec2cc1fa37d3489fafa9eaed515f11cc","edits":[[0,48,"import React,{useEffect,useRef,useState} from 'react';\n"],[599,599,"  const panelRef=useRef(null);\n  useEffect(()=>{if(panelRef.current)panelRef.current.scrollTop=0;},[selected]);\n"],[2426,2502,"  return <section ref={panelRef} className=\"cad-inspection\" aria-label=\"Propriedades CAD\">\n"]]},{"path":"src/modules/cad/CadOutliner.jsx","before":"488cc69babd8ea76e30c24de12f31c5da0100aca833c56c2f04b3f42c84cfb32","after":"02195285a55b61922b0511810b5b55875d5b7a884d537fcbe2d0dada2e2f9df0","edits":[[599,599,"    const layerNames=new Map(sketch.layers.map(l=>[l.id,l.name]));\n"],[692,816,"      if(!q||`${name} ${entity.id} ${layerNames.get(entity.layerId)||''}`.toLocaleLowerCase('pt-BR').includes(q))groups.get(entity.layerId)?.push({entity,name});\n"]]},{"path":"scripts/smoke-studio.mjs","before":"8f062f364a1312d4c4577216eb0ec38c4ab9681d223e742016a6f2c8e7136bad","after":"0830730a9af6b22cb28470602e83cb748d04c7e3790c17f9d76a2e3f21c54e09","edits":[[643,737,"let dxf=pairs(0,'SECTION',2,'HEADER',9,'$INSUNITS',70,4,0,'ENDSEC',\n  0,'SECTION',2,'TABLES',0,'TABLE',2,'LAYER',70,2,\n  0,'LAYER',2,'Contorno',62,7,70,0,420,parseInt('C8515E',16),\n  0,'LAYER',2,'Furos',62,7,70,0,420,parseInt('A6A0A6',16),\n  0,'ENDTAB',0,'ENDSEC',0,'SECTION',2,'ENTITIES');\n"],[4409,4409,"  phase='undo layer creation restores a valid active layer';\n  await page.getByLabel('Nome da nova camada').fill('Camada temporária');\n  await page.getByRole('button',{name:'+ Criar',exact:true}).click();\n  await page.getByText('Camada criada: Camada temporária',{exact:true}).waitFor();\n  await page.getByRole('button',{name:'Desfazer',exact:true}).click();\n  await page.waitForFunction(()=>document.querySelector('[aria-label=\"Nome da camada ativa\"]')?.value==='Contorno');\n  assert.equal(await page.getByRole('treeitem',{name:/Camada temporária/}).count(),0);\n  await page.getByRole('treeitem',{name:'Perfil externo',exact:true}).click();\n"],[7878,7878,"  assert.equal(await page.getByRole('button',{name:'Salvar fluxo',exact:true}).count(),0,\n    'CAD deve mostrar somente o salvamento do desenho, não do fluxo inativo.');\n  assert.equal(await page.locator('.cad-inspection').evaluate(el=>el.scrollTop),0);\n  await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));\n"],[8185,8185,"  await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));\n"],[8757,8757,"  await page.locator('.react-flow__node').first().waitFor();\n  await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));\n"]]}]''')
          expected={'src/modules/cad/CadWorkbench.jsx','src/workbench/AppShell.jsx','src/modules/cad/CadInspector.jsx','src/modules/cad/CadOutliner.jsx','scripts/smoke-studio.mjs'}
          assert {e['path'] for e in entries}==expected
          prepared=[]
          for item in entries:
            file=Path(item['path']); assert not file.is_symlink()
            text=file.read_text(encoding='utf-8')
            digest=hashlib.sha256(text.encode()).hexdigest()
            if digest==item['after']:continue
            assert digest==item['before'], 'Baseline differs: '+item['path']
            for start,end,value in reversed(item['edits']):
              assert 0<=start<=end<=len(text)
              text=text[:start]+value+text[end:]
            assert hashlib.sha256(text.encode()).hexdigest()==item['after'], 'Output differs: '+item['path']
            prepared.append((file,text))
          if prepared:
            for file,text in prepared:file.write_text(text,encoding='utf-8',newline='')
            subprocess.run(['git','diff','--check'],check=True)
            subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','add','--',*[str(p) for p,_ in prepared]],check=True)
            subprocess.run(['git','commit','-m','fix(studio): contextual save, inspector selection and undo layer reconciliation'],check=True)
            subprocess.run(['git','push','origin','HEAD:refs/heads/feature/v0.7.7-studio-ux'],check=True)
          print('PASS reviewed source hashes; main unchanged.')
