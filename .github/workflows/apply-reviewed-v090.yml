name: Apply reviewed v090 source
on:
  push:
    branches: [feature/v0.9.0-project-data-suite]
    paths: [.github/workflows/apply-reviewed-v090.yml]
permissions:
  contents: write
jobs:
  reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct reviewed source, verify hashes and remove transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = a082834465f4b97a6d00b9ac8609cdaeb160675c
          python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          chunks=['1b6552d34400eb09d0014a8bf655ef7275f5deb9','dd20f3bf2214a0cb96b965944cdfc97bd6ff682e','de2e4d1512dd9b5fa2e349ad6c28f93a0debce39','24e834485c4acca7cbecd60b545c715d42514af7','f29c7b8793b66e0714cab39a96ba5ebeaf0a91a4','98c084fc58d6a057339b64d795c2029b68bd3617','2b79b10d36ecefb484ae0f49841bfaae7a94d9df','a02cce1bb423cf555c93ef1c8923b619f5ae55d8']
          parts=[]
          for sha in chunks:
              response=json.loads(subprocess.check_output(['gh','api','repos/DragonBlack18/OmniForge-Studio/git/blobs/'+sha]))
              assert response['encoding']=='base64'
              data=base64.b64decode(response['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          compressed=b''.join(parts)
          assert hashlib.sha256(compressed).hexdigest()=='0698e8b8d2a2f8f9fa596b97f4bfbe46dd61f920a2a8abd02742776971b55ceb'
          patch=lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='f55922e654d37ae00fcba00c6d0be4837c788b358ccaa78672223cf400731652'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          curl --fail --location --retry 2 https://raw.githubusercontent.com/mholt/PapaParse/5.5.3/papaparse.min.js -o core/vendor/papaparse.cjs
          test "$(git hash-object core/vendor/papaparse.cjs)" = f31411042b80599f9dd6126ff8fd41f8fa8f68fb
          git add core/vendor/papaparse.cjs
          git rm .github/workflows/dev-support-v090.yml .github/workflows/apply-reviewed-v090.yml
          test "$(git write-tree)" = 03725cda8042a538cf7bf52eae6bc88ab3cc732d
      - name: Validate exact source before committing
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:release
          npm test
          npm run build
          npm run budget:bundle
          test "$(git write-tree)" = 03725cda8042a538cf7bf52eae6bc88ab3cc732d
      - name: Commit reviewed branch without touching main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v0.9.0): project authoring and 26 tested data automation tools' -m 'Reviewed tree 03725cda8042a538cf7bf52eae6bc88ab3cc732d matches local source. Untitled documents, Save As, safe file organization, project kits, 26 bounded data tools and pinned PapaParse MIT. All prior tests and Windows acceptance remain mandatory before merge. Temporary transfer helpers removed.'
          git push origin HEAD:refs/heads/feature/v0.9.0-project-data-suite
