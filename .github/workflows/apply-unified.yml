name: Apply integrity checked unified source
on:
  push:
    branches: [feature/v0.7.9-unified-flows]
    paths: [.github/workflows/apply-unified.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source without executing project code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/v0.7.9-unified-flows'
          git merge-base --is-ancestor 3ab8f1513523817c69b8488e39973c00d5a9debd HEAD
          cat .github/unified.patch.{0,1,2} > "$RUNNER_TEMP/unified.patch.xz"
          echo "569eeb65f99f3b91b3f949378d6f1e54308a293a4c93628045212e52f62bb177  $RUNNER_TEMP/unified.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/unified.patch.xz" > "$RUNNER_TEMP/unified.patch"
          git apply --check --unidiff-zero "$RUNNER_TEMP/unified.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/unified.patch"
          git rm .github/unified.patch.0 .github/unified.patch.1 .github/unified.patch.2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v0.7.9): unify flow authoring and protected recovery with shared session transactions'
          git push origin HEAD:feature/v0.7.9-unified-flows
