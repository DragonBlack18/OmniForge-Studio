name: Publicar executaveis Windows (Downloads individuais)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verificar e publicar Setup + Portable
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe do teste PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/windows-distribution-smoke.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Dependencias do projeto
        run: npm ci --no-audit --no-fund
      - name: Verify locked release contract
        run: npm run verify:release
      - run: npm run verify:references
      - name: Testes do motor
        run: npm test
      - name: Build da interface
        run: npm run build
      - name: Verificar bundle inicial e divisão de módulos
        run: npm run budget:bundle
      - name: Interactive terminal and native PTY v0.11.0
        run: npm run smoke:terminal
        timeout-minutes: 5
      - name: Local SQLite transactions and persistence v0.11.0
        run: npm run smoke:database
        timeout-minutes: 5
      - name: Persistent CAD dimensions v0.11.0
        run: npm run smoke:cad-dimensions
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Native-Tools-V0110
          path: |
            smoke-artifacts/terminal-*.png
            smoke-artifacts/terminal-*.json
            smoke-artifacts/database-*.png
            smoke-artifacts/database-*.json
            smoke-artifacts/cad-dimensions*.png
            smoke-artifacts/cad-dimensions*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Development runtime Node and Python v0.10.0
        run: npm run smoke:development
        timeout-minutes: 4
      - name: Flow topology and real ELK worker v0.10.0
        run: npm run smoke:flow-topology
        timeout-minutes: 4
      - name: CAD arcs and static DXF blocks v0.10.0
        run: npm run smoke:cad-precision
        timeout-minutes: 4
      - name: Reference catalogue and keyboard confirmations v0.10.0
        run: npm run smoke:capabilities
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Development-Workbench-V0100
          path: |
            smoke-artifacts/development-*.png
            smoke-artifacts/development-results.json
            smoke-artifacts/flow-topology-*.png
            smoke-artifacts/flow-topology-results.json
            smoke-artifacts/cad-precision*.png
            smoke-artifacts/capabilities-*-v0100.png
            smoke-artifacts/capabilities-v0100-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Project authoring and data suite v0.9.0
        run: npm run smoke:project-suite
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Project-Data-Suite-V090
          path: |
            smoke-artifacts/project-suite-*-v090.png
            smoke-artifacts/project-suite-v090-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Multi-document IDE and real language tools v0.8.2
        run: npm run smoke:code-workspace
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Code-Workspace-V082
          path: |
            smoke-artifacts/ide-workspace-*-v082.png
            smoke-artifacts/ide-workspace-v082-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Workspace layout and real screenshots v0.8.1
        run: npm run smoke:layout
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Workspace-Layout-V081
          path: |
            smoke-artifacts/layout-*-v081.png
            smoke-artifacts/layout-v081-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Native security and private diagnostics acceptance
        run: npm run smoke:native-security
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Native-Diagnostics-V080
          path: smoke-artifacts/native-diagnostics-v080.png
          if-no-files-found: warn
      - name: Unified authoring and recovery acceptance
        run: npm run smoke:flow-integration
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Unified-Flow-Preview
          path: smoke-artifacts/flow-unified-*.png
          if-no-files-found: warn
      - name: Encrypted flow recovery and process restart
        run: npm run smoke:flow-recovery
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Flow-Recovery-Preview
          path: smoke-artifacts/flow-recovery-*.png
          if-no-files-found: warn
      - name: Studio UX and CAD inspector regression
        run: npm run smoke:studio
        timeout-minutes: 5
      - name: CAD Toolkit v0.7.8 real geometry regression
        run: npm run smoke:cad-toolkit
        timeout-minutes: 5
      - name: Flow authoring v0.7.9 real editing and execution
        run: npm run smoke:flow-authoring
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Flow-Authoring-Preview
          path: smoke-artifacts/flow-authoring-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Studio-UX-Preview
          path: smoke-artifacts/studio-*.png
          if-no-files-found: warn
      - name: Teste E2E real no Electron
        run: npm run smoke:electron
        timeout-minutes: 5
      - name: Gate real de instalação e permissão de extensões
        run: npm run smoke:extensions
        timeout-minutes: 5
      - name: Gate de tarefas npm reais no Electron
        run: npm run smoke:tasks
        timeout-minutes: 5
      - name: Gate real de agendamentos locais no Electron
        run: npm run smoke:schedules
        timeout-minutes: 5
      - name: Gate Git local real no Electron
        run: npm run smoke:git
        timeout-minutes: 5
      - name: Gate Workspace IDE no Electron
        run: npm run smoke:ide
        timeout-minutes: 5
      - name: Gate de recuperação de código local no Electron
        run: npm run smoke:recovery
        timeout-minutes: 5
      - name: Gate importação CAD DXF no Electron
        run: npm run smoke:cad-import
        timeout-minutes: 5
      - name: Gate de recuperacao CAD nao destrutiva
        run: npm run smoke:cad-recovery
        timeout-minutes: 5
      - name: Gate workbench tecnico v0.7.5
        run: npm run smoke:workbench
        timeout-minutes: 5
      - name: Gate grafico React Flow isolado da inicializacao
        run: npm run smoke:lazy-flow
        timeout-minutes: 5
      - name: Benchmark Electron real em perfis locais isolados
        run: npm run benchmark:startup
        timeout-minutes: 5
      - name: Gerar instalador e portatil
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Verify hardening in packaged executable
        run: npm run verify:packaged-security
      - name: Artifact and dependency provenance
        run: npm run release:manifest
      - name: Teste real Portable + NSIS no Windows
        shell: pwsh
        run: ./scripts/windows-distribution-smoke.ps1
      - name: Validar hashes e nomes individuais
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^0\.[0-9]+\.[0-9]+$') { throw 'Versao nao permitida' }
          $setup = "release/OmniForge-Studio-Setup-$version-x64.exe"
          $portable = "release/OmniForge-Studio-Portable-$version-x64.exe"
          foreach ($file in @($setup, $portable)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Executavel ausente: $file" }
            if ((Get-Item -LiteralPath $file).Length -lt 1000000) { throw "Executavel incompleto: $file" }
          }
          @($setup, $portable) | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_).Hash, (Split-Path $_ -Leaf)
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding utf8
          "OMNI_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publicar dois downloads independentes no GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:OMNI_VERSION"
          $existing = (& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag }
          if ($LASTEXITCODE -ne 0) { throw "Falha na consulta ao GitHub Releases" }
          if ($existing) {
            Write-Host "Release $tag ja existe; nao substituir binarios publicados."
            exit 0
          }
          $setup = "release/OmniForge-Studio-Setup-$env:OMNI_VERSION-x64.exe"
          $portable = "release/OmniForge-Studio-Portable-$env:OMNI_VERSION-x64.exe"
          $notes = @"
          OmniForge Studio $tag — pre-lancamento Windows x64.

          - Setup: instalador convencional per-user.
          - Portable: executavel independente sem instalacao.
          - Ambos sao executaveis NAO ASSINADOS e podem receber aviso do Windows SmartScreen.
          - Clique no arquivo desejado em Assets para baixar; execute manualmente no seu computador.
          - Funcionalidades ainda experimentais: uso local, sem controle de processos industriais.
          "@
          $notes | Set-Content -Path release/RELEASE_NOTES.md -Encoding utf8
          & gh release create $tag $setup $portable release/SHA256SUMS.txt release/RELEASE-MANIFEST.json release/DEPENDENCIES.json release/PACKAGED-SECURITY.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OmniForge Studio $tag (Windows)" --notes-file release/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar os executaveis no GitHub Releases" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Flow-Performance-${{ github.sha }}
          path: |
            smoke-artifacts/lazy-flow-v076.png
            smoke-artifacts/startup-benchmark-v076.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/RELEASE-MANIFEST.json
            release/DEPENDENCIES.json
            release/PACKAGED-SECURITY.json
          if-no-files-found: warn
          retention-days: 14
