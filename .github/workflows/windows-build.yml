name: Windows Desktop Package (unsigned)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read

# Skip superseded branch builds; protect Windows runner minutes.
concurrency:
  group: windows-package-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do teste PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/windows-distribution-smoke.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - run: npm ci --no-audit --no-fund
      - name: Verify locked release contract
        run: npm run verify:release
      - run: npm test
      - run: npm run build
      - run: npm run budget:bundle
      - name: Multi-document IDE and real language tools v0.8.2
        run: npm run smoke:code-workspace
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Code-Workspace-V082
          path: |
            smoke-artifacts/ide-workspace-*-v082.png
            smoke-artifacts/ide-workspace-v082-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Workspace layout and real screenshots v0.8.1
        run: npm run smoke:layout
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Workspace-Layout-V081
          path: |
            smoke-artifacts/layout-*-v081.png
            smoke-artifacts/layout-v081-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Native security and private diagnostics acceptance
        run: npm run smoke:native-security
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Native-Diagnostics-V080
          path: smoke-artifacts/native-diagnostics-v080.png
          if-no-files-found: warn
      - name: Unified authoring and recovery acceptance
        run: npm run smoke:flow-integration
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Unified-Flow-Preview
          path: smoke-artifacts/flow-unified-*.png
          if-no-files-found: warn
      - name: Encrypted flow recovery and process restart
        run: npm run smoke:flow-recovery
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Flow-Recovery-Preview
          path: smoke-artifacts/flow-recovery-*.png
          if-no-files-found: warn
      - name: Studio UX and CAD inspector regression
        run: npm run smoke:studio
        timeout-minutes: 5
      - name: CAD Toolkit v0.7.8 real geometry regression
        run: npm run smoke:cad-toolkit
        timeout-minutes: 5
      - name: Flow authoring v0.7.9 real editing and execution
        run: npm run smoke:flow-authoring
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Flow-Authoring-Preview
          path: smoke-artifacts/flow-authoring-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Studio-UX-Preview
          path: smoke-artifacts/studio-*.png
          if-no-files-found: warn
      - run: npm run smoke:electron
        timeout-minutes: 5
      - run: npm run smoke:extensions
        timeout-minutes: 5
      - run: npm run smoke:tasks
        timeout-minutes: 5
      - run: npm run smoke:schedules
        timeout-minutes: 5
      - run: npm run smoke:git
        timeout-minutes: 5
      - name: Smoke IDE - primeira execução
        run: npm run smoke:ide
        timeout-minutes: 5
      - name: Smoke IDE - segunda execução isolada
        run: npm run smoke:ide
        timeout-minutes: 5
      - name: Smoke de recuperação de código após reload
        run: npm run smoke:recovery
        timeout-minutes: 5
      - run: npm run smoke:cad-import
        timeout-minutes: 5
      - name: Gate de recuperacao CAD nao destrutiva
        run: npm run smoke:cad-recovery
        timeout-minutes: 5
      - name: Gate workbench tecnico v0.7.5
        run: npm run smoke:workbench
        timeout-minutes: 5
      - name: Gate grafico React Flow isolado da inicializacao
        run: npm run smoke:lazy-flow
        timeout-minutes: 5
      - name: Benchmark Electron real em perfis locais isolados
        run: npm run benchmark:startup
        timeout-minutes: 5
      - run: npm run dist:win
      - name: Verify hardening in packaged executable
        run: npm run verify:packaged-security
      - name: Artifact and dependency provenance
        run: npm run release:manifest
      - name: Teste real Portable + NSIS no Windows
        shell: pwsh
        run: ./scripts/windows-distribution-smoke.ps1
      - name: SHA-256 executáveis
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter '*.exe' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash, $_.Name
          } | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ide-smoke-failure
          path: smoke-artifacts/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: OmniForge-Windows-unsigned
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/RELEASE-MANIFEST.json
            release/DEPENDENCIES.json
            release/PACKAGED-SECURITY.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OmniForge-Workbench-Preview
          path: smoke-artifacts/workbench-v075.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OmniForge-Flow-Performance-V076
          path: |
            smoke-artifacts/lazy-flow-v076.png
            smoke-artifacts/startup-benchmark-v076.json
          if-no-files-found: error
