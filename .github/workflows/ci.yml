name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read

# Test feature branches through pull requests only (avoid duplicate push/PR jobs).
# Skip superseded checks to protect Windows runner capacity.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core-test:
    name: Core Node ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências em ambiente reproduzível
        run: npm install --no-audit --no-fund
        timeout-minutes: 8
      - name: Testes Node com limite de duração
        run: npm test
        timeout-minutes: 6
      - run: node --check electron/main.cjs
      - run: node --check scripts/smoke-electron.mjs
  renderer-build:
    name: Renderer production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run budget:bundle
  desktop-windows-smoke:
    name: Windows production Electron smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run budget:bundle
      - name: Studio UX and CAD inspector regression
        run: npm run smoke:studio
        timeout-minutes: 5
      - name: CAD Toolkit v0.7.8 real geometry regression
        run: npm run smoke:cad-toolkit
        timeout-minutes: 5
      - name: Flow authoring v0.7.9 real editing and execution
        run: npm run smoke:flow-authoring
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Flow-Authoring-Preview
          path: smoke-artifacts/flow-authoring-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-Studio-UX-Preview
          path: smoke-artifacts/studio-*.png
          if-no-files-found: warn
      - run: npm run smoke:electron
        timeout-minutes: 5
      - run: npm run smoke:extensions
        timeout-minutes: 5
      - run: npm run smoke:tasks
        timeout-minutes: 5
      - run: npm run smoke:schedules
      - run: npm run smoke:git
        timeout-minutes: 5
      - name: Smoke IDE - primeira execução
        run: npm run smoke:ide
        timeout-minutes: 5
      - name: Smoke IDE - segunda execução isolada
        run: npm run smoke:ide
        timeout-minutes: 5
      - name: Smoke de recuperação de código após reload
        run: npm run smoke:recovery
        timeout-minutes: 5
      - run: npm run smoke:cad-import
        timeout-minutes: 5
      - name: Gate de recuperacao CAD nao destrutiva
        run: npm run smoke:cad-recovery
        timeout-minutes: 5
      - name: Gate workbench tecnico v0.7.5
        run: npm run smoke:workbench
        timeout-minutes: 5
      - name: Gate grafico React Flow isolado da inicializacao
        run: npm run smoke:lazy-flow
        timeout-minutes: 5
      - name: Benchmark Electron real em perfis locais isolados
        run: npm run benchmark:startup
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OmniForge-Flow-Performance-V076
          path: |
            smoke-artifacts/lazy-flow-v076.png
            smoke-artifacts/startup-benchmark-v076.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: electron-smoke-failure
          path: smoke-artifacts/*
          if-no-files-found: ignore
