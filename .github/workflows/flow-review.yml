name: Apply reviewed atomic flow edits
on:
  push:
    branches: [feature/v0.7.9-flow-authoring]
    paths: [.github/workflows/flow-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          python3 - <<'PY'
          import subprocess,lzma,base64
          from pathlib import Path
          if subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()!='ea935db6c110d50e842435fe010d594ea7d1674c': raise SystemExit('Unexpected parent')
          encoded=''
          patch=Path('/tmp/flow-review.patch');patch.write_bytes(lzma.decompress(base64.b64decode(encoded)))
          subprocess.run(['git','apply','--check','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(patch)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests
          git commit -m 'fix(flow): group keyboard deletion and incident wires into one reversible edit'
          git push origin HEAD:feature/v0.7.9-flow-authoring
