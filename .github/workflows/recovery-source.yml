name: Recovery source snapshot
on:
  push:
    branches: [feature/v0.7.9-flow-recovery]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OmniForge-v079-source
          path: source.zip
          retention-days: 2
          if-no-files-found: error
