name: Apply reviewed recovery implementation
on:
  push:
    branches: [feature/v0.7.9-flow-recovery]
    paths: [.github/workflows/apply-reviewed-recovery.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checked patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8504b52e5df1ef9d2cbcd2583b08c21a1a115c9f HEAD
          cat .github/recovery.patch.{0,1,2,3} > "$RUNNER_TEMP/recovery.patch.xz"
          echo "ceb900e6e8aae9c6102e5d640f35bb8a5c26d13bb9e625accfda8cc172795843  $RUNNER_TEMP/recovery.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/recovery.patch.xz" > "$RUNNER_TEMP/recovery.patch"
          git apply --check "$RUNNER_TEMP/recovery.patch"
          git apply --index "$RUNNER_TEMP/recovery.patch"
          git rm .github/recovery.patch.0 .github/recovery.patch.1 .github/recovery.patch.2 .github/recovery.patch.3 .github/workflows/apply-reviewed-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(v0.7.9): encrypted flow recovery and session-safe restore'
          git push origin HEAD:feature/v0.7.9-flow-recovery
