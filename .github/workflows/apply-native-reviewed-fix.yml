name: Apply verified native lifecycle correction
on:
  push:
    branches: [feature/v0.8.0-production-foundation]
    paths: [.github/workflows/apply-native-reviewed-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ee46522a11ab45a2da874184f6355fdaa26884cc HEAD
          echo '5d2680a2d1cc4e465cc6908443e4f0eeb48e06fbab530d325a7ff467f9a81e31  .github/native-reviewed-fix.patch.xz' | sha256sum -c -
          xz -dc .github/native-reviewed-fix.patch.xz > "$RUNNER_TEMP/native.patch"
          git apply --check --unidiff-zero "$RUNNER_TEMP/native.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/native.patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v0.8.0): transactional native shutdown and awaited IPC state tests'
          git push origin HEAD:feature/v0.8.0-production-foundation
